name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic:
    name: 逻辑与内容门禁
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 作者版案件校验（唯一解 + 逐条必要性）
        run: python engine/verify_cases.py

      - name: Python 单元测试
        run: python -m unittest discover -s tests/logic -p 'test_*.py' -v

      - name: JavaScript 单元测试
        run: node --test tests/logic/solver.test.mjs tests/logic/player_state.test.mjs tests/logic/deduction_notes.test.mjs tests/logic/save_vault.test.mjs tests/logic/guide_state.test.mjs

      - name: Python ⇄ JavaScript 规则一致性
        run: python tests/logic/cross_check.py

      - name: 构建站点（干净暂存目录 + 严格案件白名单）
        run: node tools/build.mjs

      - name: 构建并验证 itch.io HTML5 发行包
        run: python tools/build_itch.py

      - name: 生成发布状态仪表盘
        run: python tools/build_dashboard.py

      - name: Safari 键盘可达性（index.html <a> 必须带 tabindex）
        run: python tools/add_tabindex.py --check

      - name: 门禁自证（植入坏输入必须失败）
        run: |
          python tests/logic/test_gate_no_remote.py
          python tests/logic/test_gate_links.py

      - name: 封面图泄题检查（tools/check_cover_art.py）
        run: python tools/check_cover_art.py

      - name: 许可覆盖完整性（tools/check_license_coverage.py）
        run: python tools/check_license_coverage.py

      - name: 站内链接完整性（tools/check_links.py）
        run: python tools/check_links.py dist

      - name: 发布包卫生检查（不得含作者答案）
        run: |
          set -e
          if grep -rl --include='*.json' '"expected_solution"' dist/ ; then
            echo "::error::dist/ 中出现了 expected_solution"
            exit 1
          fi
          echo "OK: dist 无作者答案字段"

      - name: 无第三方远程资源（tools/check_no_remote.py）
        run: python tools/check_no_remote.py dist

      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: itch-html5-release
          path: release/itch-html5-release.zip
          retention-days: 14

  browser:
    name: 真实浏览器端到端
    runs-on: ubuntu-24.04
    needs: logic
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 安装 Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium firefox webkit

      - name: 构建
        run: node tools/build.mjs

      - name: 启动静态服务器
        run: |
          python -m http.server 8080 --directory dist &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ > /dev/null && break
            sleep 1
          done

      - name: 端到端测试
        run: python tests/browser/e2e.py --base http://127.0.0.1:8080

      - name: 玩家体验升级回归（存档、撤销重做、续玩、双语和导航）
        run: python tests/browser/ux_v3.py --base http://127.0.0.1:8080

      - name: V4 情境导航与证据定位回归
        run: python tests/browser/ux_v4.py --base http://127.0.0.1:8080

      - name: V5 英文操作、错误恢复与清空存档回归
        run: python tests/browser/ux_v5.py --base http://127.0.0.1:8080

      - name: V6 推理笔记工作台专项回归
        run: python tests/browser/ux_v6.py --base http://127.0.0.1:8080

      - name: V7 离线存档保险箱安全恢复回归
        run: python tests/browser/ux_v7.py --base http://127.0.0.1:8080

      - name: V7 第一案情境引导回归
        run: python tests/browser/guide_v7.py --base http://127.0.0.1:8080

      - name: 无障碍门禁（axe-core，零违规）
        run: python tests/browser/a11y.py --base http://127.0.0.1:8080

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-report
          path: screenshots/
          retention-days: 14
