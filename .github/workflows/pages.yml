name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署；不取消进行中的正式发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建与门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 内容门禁（不通过就不部署）
        run: |
          set -e
          python engine/verify_cases.py
          python -m unittest discover -s tests/logic -p 'test_*.py'
          node --test tests/logic/solver.test.mjs
          python tests/logic/cross_check.py

      - name: 构建静态站点
        env:
          BUILD_VERSION: ${{ github.sha }}
        run: node tools/build.mjs

      - name: 生成发布状态仪表盘
        run: python tools/build_dashboard.py

      - name: 站内链接完整性
        run: python tools/check_links.py dist

      - name: 校验发布产物
        run: |
          set -e
          test -f dist/index.html || { echo "::error::缺少 index.html"; exit 1; }
          test -f dist/app.mjs || { echo "::error::缺少 app.mjs"; exit 1; }
          test -f dist/engine/solver.mjs || { echo "::error::缺少求解核心"; exit 1; }
          ls dist/cases/*.json | wc -l
          if grep -rl --include='*.json' '"expected_solution"' dist/; then
            echo "::error::发布包泄漏作者答案"; exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
